groups:
  - name: metergate_slo_alerts
    rules:
      - alert: PolicyEvalP99High
        expr: histogram_quantile(0.99, rate(metergate_policy_eval_duration_seconds_bucket[1m])) > 0.005
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "High Policy Evaluation Latency"
          description: "P99 Policy Evaluation Latency is over 5ms (current value: {{ $value }}s)"

      - alert: RedisLatencyHigh
        expr: histogram_quantile(0.99, rate(metergate_redis_operation_duration_seconds_bucket{operation="INCR"}[1m])) > 0.010
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "High Redis INCR Latency"
          description: "P99 Redis INCR Latency is over 10ms (current value: {{ $value }}s)"
