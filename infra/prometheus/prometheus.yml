global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - "prometheus-alerts.yaml"

scrape_configs:
  - job_name: "metergate-dataplane"
    metrics_path: '/metrics'
    dns_sd_configs:
      - names:
          - dataplane
        type: A
        port: 6060
    static_configs:
      - targets: ['host.docker.internal:6060']
