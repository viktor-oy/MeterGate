name: metergate

x-metergate-env: &metergate-env
  NODE_ENV: development
  METERGATE_PORT: 3000
  METERGATE_CONFIG_PATH: infra/metergate.yml
  METERGATE_KEY_HASH_SECRET: local-demo-secret-change-me
  DATABASE_URL: postgresql://metergate:metergate@postgres:5432/metergate?schema=public
  REDIS_URL: redis://redis:6379
  REDIS_CLUSTER_MODE: ${REDIS_CLUSTER_MODE:-false}
  LOG_LEVEL: info

services:
  controlplane:
    build:
      context: ..
      dockerfile: src/controlplane/Dockerfile
    deploy:
      replicas: ${CP_REPLICAS:-1}
    environment:
      <<: *metergate-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "3000-3005:3000"
      - "9464-9469:9464"

  dataplane:
    build:
      context: ..
      dockerfile: src/dataplane/Dockerfile
    deploy:
      replicas: ${DP_REPLICAS:-1}
    environment:
      - REDIS_HOST=redis:6379
      - METERGATE_CONFIG_PATH=/app/config/metergate.yml
      - DISABLE_ZERO_ALLOC=false
      - METERGATE_KEY_HASH_SECRET=${METERGATE_KEY_HASH_SECRET:-local-demo-secret-change-me}
    volumes:
      - ./metergate.yml:/app/config/metergate.yml:ro
    ports:
      - "8080-8085:8080" # Proxy Port
      - "6060-6065:6060" # Internal Metrics & Pprof Port
    depends_on:
      redis:
        condition: service_healthy
