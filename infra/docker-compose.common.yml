name: metergate

x-metergate-env: &metergate-env
  NODE_ENV: development
  METERGATE_PORT: 3000
  METERGATE_CONFIG_PATH: infra/metergate.yml
  METERGATE_KEY_HASH_SECRET: local-demo-secret-change-me
  DATABASE_URL: postgresql://metergate:metergate@postgres:5432/metergate?schema=public
  REDIS_URL: redis://redis:6379
  LOG_LEVEL: info

services:
  metergate:
    build:
      context: ..
      dockerfile: src/controlplane/Dockerfile
    environment:
      <<: *metergate-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "3000-3010:3000"
      - "9464:9464"
