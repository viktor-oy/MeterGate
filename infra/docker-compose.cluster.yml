  redis-node-9:
    image: redis:7.4.2-bookworm
    command: ["redis-server", "--port", "6379", "--cluster-enabled", "yes", "--cluster-config-file", "nodes.conf", "--cluster-node-timeout", "5000", "--appendonly", "yes", "--min-replicas-to-write", "1", "--min-replicas-max-lag", "5"]
    ports:
      - "6379:6379"
    volumes:
      - ../.data/redis-9:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "6379", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis-cluster-init:
    image: redis:7.4.2-bookworm
    depends_on:
      redis-node-1:
        condition: service_healthy
      redis-node-2:
        condition: service_healthy
      redis-node-3:
        condition: service_healthy
      redis-node-4:
        condition: service_healthy
      redis-node-5:
        condition: service_healthy
      redis-node-6:
        condition: service_healthy
      redis-node-7:
        condition: service_healthy
      redis-node-8:
        condition: service_healthy
      redis-node-9:
        condition: service_healthy
    command: >
      sh -c 'echo "yes" | redis-cli --cluster create redis-node-1:6371 redis-node-2:6372 redis-node-3:6373 redis-node-4:6374 redis-node-5:6375 redis-node-6:6376 redis-node-7:6377 redis-node-8:6378 redis-node-9:6379 --cluster-replicas 2'
