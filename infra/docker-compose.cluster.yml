    command: ["redis-server", "--port", "6378", "--cluster-enabled", "yes", "--cluster-config-file", "nodes.conf", "--cluster-node-timeout", "5000", "--appendonly", "yes", "--min-replicas-to-write", "1", "--min-replicas-max-lag", "5"]
