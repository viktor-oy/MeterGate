name: metergate-infra

services:
  postgres:
    image: postgres:17.4-bookworm
    environment:
      POSTGRES_DB: metergate
      POSTGRES_USER: metergate
      POSTGRES_PASSWORD: metergate
    ports:
      - "5432:5432"
    volumes:
      - ../.data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U metergate -d metergate"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis-node-1:
    image: redis:7.4.2-bookworm
    command: ["redis-server", "--port", "6371", "--cluster-enabled", "yes", "--cluster-config-file", "nodes.conf", "--cluster-node-timeout", "5000", "--appendonly", "yes", "--min-replicas-to-write", "1", "--min-replicas-max-lag", "5"]
    ports:
      - "6371:6371"
    volumes:
      - ../.data/redis-1:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "6371", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis-node-2:
    image: redis:7.4.2-bookworm
    command: ["redis-server", "--port", "6372", "--cluster-enabled", "yes", "--cluster-config-file", "nodes.conf", "--cluster-node-timeout", "5000", "--appendonly", "yes", "--min-replicas-to-write", "1", "--min-replicas-max-lag", "5"]
    ports:
      - "6372:6372"
    volumes:
      - ../.data/redis-2:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "6372", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis-node-3:
    image: redis:7.4.2-bookworm
    command: ["redis-server", "--port", "6373", "--cluster-enabled", "yes", "--cluster-config-file", "nodes.conf", "--cluster-node-timeout", "5000", "--appendonly", "yes", "--min-replicas-to-write", "1", "--min-replicas-max-lag", "5"]
    ports:
      - "6373:6373"
    volumes:
      - ../.data/redis-3:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "6373", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis-node-4:
    image: redis:7.4.2-bookworm
    command: ["redis-server", "--port", "6374", "--cluster-enabled", "yes", "--cluster-config-file", "nodes.conf", "--cluster-node-timeout", "5000", "--appendonly", "yes", "--min-replicas-to-write", "1", "--min-replicas-max-lag", "5"]
    ports:
      - "6374:6374"
    volumes:
      - ../.data/redis-4:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "6374", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis-node-5:
    image: redis:7.4.2-bookworm
    command: ["redis-server", "--port", "6375", "--cluster-enabled", "yes", "--cluster-config-file", "nodes.conf", "--cluster-node-timeout", "5000", "--appendonly", "yes", "--min-replicas-to-write", "1", "--min-replicas-max-lag", "5"]
    ports:
      - "6375:6375"
    volumes:
      - ../.data/redis-5:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "6375", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis-node-6:
    image: redis:7.4.2-bookworm
    command: ["redis-server", "--port", "6376", "--cluster-enabled", "yes", "--cluster-config-file", "nodes.conf", "--cluster-node-timeout", "5000", "--appendonly", "yes", "--min-replicas-to-write", "1", "--min-replicas-max-lag", "5"]
    ports:
