name: metergate-infra

services:
  postgres:
    image: postgres:17.4-bookworm
    deploy:
      replicas: ${POSTGRES_REPLICAS:-1}
    environment:
      POSTGRES_DB: metergate
      POSTGRES_USER: metergate
      POSTGRES_PASSWORD: metergate
    ports:
      - "5432-5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U metergate -d metergate"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7.4.2-bookworm
    command: ["redis-server", "--port", "6379", "--cluster-enabled", "yes", "--cluster-config-file", "nodes.conf", "--cluster-node-timeout", "5000", "--appendonly", "yes"]
    ports:
      - "6371:6379"
    volumes:
      - ../.data/redis-1:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "6379", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis-node-2:
    image: redis:7.4.2-bookworm
    command: ["redis-server", "--port", "6372", "--cluster-enabled", "yes", "--cluster-config-file", "nodes.conf", "--cluster-node-timeout", "5000", "--appendonly", "yes"]
    ports:
      - "6372:6372"
    volumes:
      - ../.data/redis-2:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "6372", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis-node-3:
    image: redis:7.4.2-bookworm
    command: ["redis-server", "--port", "6373", "--cluster-enabled", "yes", "--cluster-config-file", "nodes.conf", "--cluster-node-timeout", "5000", "--appendonly", "yes"]
    ports:
      - "6373:6373"
    volumes:
      - ../.data/redis-3:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "6373", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis-cluster-init:
    image: redis:7.4.2-bookworm
    depends_on:
      redis:
        condition: service_healthy
      redis-node-2:
        condition: service_healthy
      redis-node-3:
        condition: service_healthy
    command: >
      sh -c 'echo "yes" | redis-cli --cluster create redis:6379 redis-node-2:6372 redis-node-3:6373 --cluster-replicas 0'

  prometheus:
    image: prom/prometheus:v2.54.1
    deploy:
      replicas: ${PROMETHEUS_REPLICAS:-2}
    ports:
      - "9090-9092:9090"
    volumes:
      - ./prometheus:/etc/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
    
  grafana:
    image: grafana/grafana:11.2.0
    deploy:
      replicas: ${GRAFANA_REPLICAS:-1}
    ports:
      - "3000-3005:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/var/lib/grafana/dashboards
